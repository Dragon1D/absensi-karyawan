<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi Karyawan</title>
    <!-- Tailwind CSS untuk Styling Cepat & Rapi -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen p-4">

    <!-- Container Utama (Ukuran Layar Mobile) -->
    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl overflow-hidden flex flex-col h-[90vh] max-h-[850px]">
        
        <!-- Header Profil -->
        <div class="bg-indigo-600 text-white p-5 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">Portal Absensi</h1>
                <p class="text-xs text-indigo-200" id="current-date">Memuat tanggal...</p>
            </div>
            <div class="bg-indigo-500 px-3 py-1 rounded-full text-xs font-medium border border-indigo-400">
                Karyawan Aktif
            </div>
        </div>

        <!-- Konten Utama (Scrollable) -->
        <div class="p-5 flex-1 overflow-y-auto space-y-5">
            
            <!-- Live Clock Widget -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-center">
                <p class="text-xs text-indigo-500 font-semibold uppercase tracking-wider">Waktu Saat Ini</p>
                <h2 class="text-3xl font-extrabold text-indigo-900 mt-1" id="live-clock">00:00:00</h2>
            </div>

            <!-- Input Nama Karyawan (Baru) -->
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Nama / ID Karyawan</label>
                <input type="text" id="employee-name" placeholder="Masukkan Nama Lengkap Anda" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
            </div>

            <!-- Panel Status Absen -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-500">Status Hari Ini:</span>
                    <span id="attendance-status" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">Belum Absen</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-500">Lokasi GPS:</span>
                    <span id="gps-status" class="text-slate-700 font-medium truncate max-w-[200px]">Mendeteksi lokasi...</span>
                </div>
            </div>

            <!-- Kamera / Bukti Foto -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Verifikasi Foto Wajah</label>
                <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center bg-slate-50 relative">
                    <input type="file" accept="image/*" capture="user" id="camera-input" class="absolute inset-0 opacity-0 cursor-pointer" onchange="previewImage(event)">
                    <div id="camera-placeholder" class="space-y-2">
                        <svg class="w-8 h-8 mx-auto text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <p class="text-xs text-slate-500">Tap untuk Ambil Foto / Selfie</p>
                    </div>
                    <img id="image-preview" class="hidden w-full h-36 object-cover rounded-lg mx-auto" alt="Preview">
                </div>
            </div>

            <!-- Tombol Aksi (Clock In / Out) -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="submitAttendance('Clock In')" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2 cursor-pointer">
                    <span>Clock In</span>
                </button>
                <button onclick="submitAttendance('Clock Out')" class="bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2 cursor-pointer">
                    <span>Clock Out</span>
                </button>
            </div>

        </div>

        <!-- Footer Info -->
        <div class="bg-slate-50 border-t border-slate-200 p-3 text-center text-xs text-slate-400">
            Absensi App • Versi MVP 1.0
        </div>

    </div>

    <!-- JavaScript Interaksi & API ke Spreadsheet -->
    <script>
        // Jam Real-time
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('id-ID');
            document.getElementById('current-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

        // Ambil Koordinat GPS Otomatis saat halaman dibuka
        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(5);
                        const lon = position.coords.longitude.toFixed(5);
                        document.getElementById('gps-status').innerText = `${lat}, ${lon}`;
                        document.getElementById('gps-status').className = "text-emerald-600 font-semibold text-xs";
                    },
                    (error) => {
                        document.getElementById('gps-status').innerText = "GPS Gagal / Ditolak";
                        document.getElementById('gps-status').className = "text-rose-600 font-semibold text-xs";
                    }
                );
            } else {
                document.getElementById('gps-status').innerText = "Tidak Didukung Browser";
            }
        };

        // Preview Foto
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('image-preview');
                output.src = reader.result;
                output.classList.remove('hidden');
                document.getElementById('camera-placeholder').classList.add('hidden');
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        // Fungsi Kirim Absen ke Google Spreadsheet
        async function submitAttendance(type) {
            const name = document.getElementById('employee-name').value.trim();
            const gps = document.getElementById('gps-status').innerText;
            
            // Validasi Nama
            if (!name) {
                alert("Harap masukkan Nama Lengkap Anda terlebih dahulu!");
                document.getElementById('employee-name').focus();
                return;
            }

            // Validasi GPS
            if (gps.includes("Gagal") || gps.includes("Mendeteksi")) {
                alert("Harap tunggu lokasi GPS terdeteksi atau aktifkan izin lokasi di browser Anda!");
                return;
            }

            const payload = {
                nama: name,
                status: type,
                gps: gps,
                foto: true
            };

            // ========================================================
            // GANTI URL DI BAWAH INI DENGAN URL WEB APP (/exec) ANDA
            // ========================================================
            const scriptURL = 'https://script.google.com/macros/s/AKfycbzaKGJAQAdNBcjXZXgrIJln120_UTOytkBn2vm6oOUi3ORswJzYJy6iWfBYT5dC2S856w/exec';

            if (scriptURL.includes('MASUKKAN_URL')) {
                alert("URL Google Apps Script belum dipasang di dalam kode!");
                return;
            }

            try {
                alert("Mengirim data absensi ke server...");
                
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors', // Wajib agar tidak terkena blokir CORS Google
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert(`Berhasil ${type} untuk ${name}!\nData telah tercatat otomatis di Google Spreadsheet.`);
                document.getElementById('attendance-status').innerText = type === 'Clock In' ? 'Sudah Clock In' : 'Sudah Selesai Kerja';
                document.getElementById('attendance-status').className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800";

            } catch (error) {
                console.error('Error!', error.message);
                alert("Gagal terhubung ke server database.");
            }
        }
    </script>
</body>
</html>
