<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi Sales Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl overflow-hidden flex flex-col h-[90vh] max-h-[850px]">
        
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-5 flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-lg font-bold">Portal Absensi Store</h1>
                <p class="text-xs text-indigo-200" id="current-date">Memuat tanggal...</p>
            </div>
            <div class="bg-indigo-500 px-3 py-1 rounded-full text-xs font-medium border border-indigo-400">
                Sales Active
            </div>
        </div>

        <!-- Konten Utama -->
        <div class="p-5 flex-1 overflow-y-auto space-y-4">
            
            <!-- Live Clock -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3.5 text-center">
                <p class="text-xs text-indigo-500 font-semibold uppercase tracking-wider">Waktu Saat Ini</p>
                <h2 class="text-3xl font-extrabold text-indigo-900 mt-0.5" id="live-clock">00:00:00</h2>
            </div>

            <!-- Dropdown Store -->
            <div class="space-y-1">
                <label for="select-store" class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Cabang / Store</label>
                <select id="select-store" onchange="onStoreChange()" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-medium text-slate-800 transition">
                    <option value="">-- Memuat Daftar Store... --</option>
                </select>
            </div>

            <!-- Dropdown Sales -->
            <div class="space-y-1">
                <label for="select-employee" class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Nama Sales / Karyawan</label>
                <select id="select-employee" disabled class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-100 font-medium text-slate-500 disabled:cursor-not-allowed transition">
                    <option value="">-- Pilih Store Terlebih Dahulu --</option>
                </select>
            </div>

            <!-- Status & GPS -->
            <div class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-sm space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-500">Status Hari Ini:</span>
                    <span id="attendance-status" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">Belum Absen</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-500">Lokasi GPS:</span>
                    <span id="gps-status" class="text-slate-700 font-medium truncate max-w-[200px]">Mendeteksi lokasi...</span>
                </div>
            </div>

            <!-- Mandatory Foto Selfie -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider flex justify-between">
                    <span>Verifikasi Foto Selfie</span>
                    <span class="text-rose-500 text-[10px] font-bold">*WAJIB FOTO</span>
                </label>
                <div class="border-2 border-dashed border-slate-300 rounded-xl p-3 text-center bg-slate-50 relative hover:bg-slate-100 transition">
                    <input type="file" accept="image/*" capture="user" id="camera-input" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="previewAndCompressImage(event)">
                    <div id="camera-placeholder" class="space-y-1">
                        <svg class="w-7 h-7 mx-auto text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <p class="text-xs text-slate-500" id="photo-label">Tap untuk Ambil Foto Selfie</p>
                    </div>
                    <img id="image-preview" class="hidden w-full h-32 object-cover rounded-lg mx-auto" alt="Preview Foto Selfie">
                </div>
            </div>

            <!-- Tombol Clock In / Out -->
            <div class="grid grid-cols-2 gap-3 pt-1">
                <button id="btn-clock-in" onclick="submitAttendance('Clock In')" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    <span>Clock In</span>
                </button>
                <button id="btn-clock-out" onclick="submitAttendance('Clock Out')" class="bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition text-sm flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    <span>Clock Out</span>
                </button>
            </div>

        </div>

        <!-- Footer -->
        <div class="bg-slate-50 border-t border-slate-200 p-2.5 text-center text-xs text-slate-400 shrink-0">
            Absensi Retail App • Multi-Store v2.0
        </div>

    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbysnYJNbtypJLXnG9OzVJF7Q9X1uMl9kjqzR_ukg-Jnq4GKGNHnbOAQbqrPd3FEvfu0/exec';

        let masterStores = [];
        let masterKaryawan = [];
        let compressedBase64Photo = "";

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('id-ID');
            document.getElementById('current-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

        window.onload = async function() {
            initGPS();
            await fetchMasterData();
        };

        function initGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const lat = pos.coords.latitude.toFixed(5);
                        const lon = pos.coords.longitude.toFixed(5);
                        
                        const gpsElem = document.getElementById('gps-status');
                        gpsElem.innerText = "Menerjemahkan alamat...";
                        gpsElem.className = "text-amber-600 font-semibold text-xs animate-pulse";

                        try {
                            const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`);
                            const data = await res.json();

                            const area = [data.locality || data.city, data.principalSubdivision].filter(Boolean).join(', ');
                            const addressText = area ? `${area} (${lat}, ${lon})` : `${lat}, ${lon}`;

                            gpsElem.innerText = addressText;
                            gpsElem.className = "text-emerald-600 font-semibold text-xs truncate max-w-[200px]";
                            gpsElem.title = addressText;
                        } catch (err) {
                            gpsElem.innerText = `${lat}, ${lon}`;
                            gpsElem.className = "text-emerald-600 font-semibold text-xs";
                        }
                    },
                    (err) => {
                        document.getElementById('gps-status').innerText = "GPS Ditolak / Off";
                        document.getElementById('gps-status').className = "text-rose-600 font-semibold text-xs";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                document.getElementById('gps-status').innerText = "GPS Tidak Didukung";
                document.getElementById('gps-status').className = "text-rose-600 font-semibold text-xs";
            }
        }

        async function fetchMasterData() {
            const selectStore = document.getElementById('select-store');
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                
                if (data.status === "success") {
                    masterStores = data.stores || [];
                    masterKaryawan = data.karyawan || [];
                    populateStoreDropdown();
                } else {
                    selectStore.innerHTML = '<option value="">-- Gagal Memuat Data --</option>';
                }
            } catch (err) {
                selectStore.innerHTML = '<option value="">-- Error Koneksi Server --</option>';
            }
        }

        function populateStoreDropdown() {
            const selectStore = document.getElementById('select-store');
            selectStore.innerHTML = '<option value="">-- Pilih Store --</option>';
            masterStores.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.nama;
                selectStore.appendChild(opt);
            });
        }

        function onStoreChange() {
            const storeId = document.getElementById('select-store').value;
            const selectEmp = document.getElementById('select-employee');
            selectEmp.innerHTML = '';
            
            if (!storeId) {
                selectEmp.disabled = true;
                selectEmp.className = "w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-slate-100 text-slate-500 disabled:cursor-not-allowed transition";
                selectEmp.innerHTML = '<option value="">-- Pilih Store Terlebih Dahulu --</option>';
                return;
            }

            const filteredEmp = masterKaryawan.filter(k => k.storeId === storeId);
            selectEmp.disabled = false;
            selectEmp.className = "w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-slate-50 text-slate-800 font-medium focus:ring-2 focus:ring-indigo-500 transition";
            selectEmp.innerHTML = '<option value="">-- Pilih Nama Sales --</option>';

            filteredEmp.forEach(k => {
                const opt = document.createElement('option');
                opt.value = k.nama;
                opt.textContent = `${k.nama} (${k.jabatan})`;
                selectEmp.appendChild(opt);
            });
        }

        function previewAndCompressImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const scale = MAX_WIDTH / img.width;

                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scale;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    compressedBase64Photo = canvas.toDataURL('image/jpeg', 0.6);

                    const output = document.getElementById('image-preview');
                    output.src = compressedBase64Photo;
                    output.classList.remove('hidden');
                    document.getElementById('camera-placeholder').classList.add('hidden');
                };
            };
        }

        async function submitAttendance(type) {
            const storeSelect = document.getElementById('select-store');
            const storeNama = storeSelect.options[storeSelect.selectedIndex]?.text || '';
            const karyawanNama = document.getElementById('select-employee').value;
            const gps = document.getElementById('gps-status').innerText;

            if (!storeSelect.value) {
                alert("Harap pilih Store lokasi kerja Anda!");
                return;
            }
            if (!karyawanNama) {
                alert("Harap pilih Nama Sales Anda!");
                return;
            }
            if (!compressedBase64Photo) {
                alert("FOTO WAJIB DIAMBIL! Harap ambil foto selfie terlebih dahulu sebelum absen.");
                return;
            }
            if (gps.includes("Ditolak") || gps.includes("Mendeteksi") || gps.includes("Tidak Didukung")) {
                alert("Harap tunggu lokasi GPS terdeteksi atau aktifkan akses lokasi di browser!");
                return;
            }

            const payload = {
                storeNama: storeNama,
                karyawanNama: karyawanNama,
                status: type,
                gps: gps,
                fotoBase64: compressedBase64Photo
            };

            const btnIn = document.getElementById('btn-clock-in');
            const btnOut = document.getElementById('btn-clock-out');
            btnIn.disabled = true;
            btnOut.disabled = true;

            try {
                alert(`Mengirim data & mengunggah foto ke Drive... Mohon tunggu.`);
                
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert(`Berhasil ${type}!\nSales: ${karyawanNama}\nStore: ${storeNama}\nFoto telah tersimpan di Google Drive.`);
                document.getElementById('attendance-status').innerText = type === 'Clock In' ? 'Sudah Clock In' : 'Sudah Clock Out';
                document.getElementById('attendance-status').className = "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800";

            } catch (err) {
                alert("Gagal mengirim absensi ke server.");
            } finally {
                btnIn.disabled = false;
                btnOut.disabled = false;
            }
        }
    </script>
</body>
</html>
