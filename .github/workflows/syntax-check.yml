name: JS Syntax Checker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-js:
    runs-on: ubuntu-latest
    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify JavaScript Syntax
        run: |
          echo "🔍 Memeriksa keutuhan & sintaks file JavaScript..."
          node --check app.js
          for file in modules/*.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done
          echo "✅ Semua file JS utuh dan bebas dari syntax error!"
