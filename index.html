<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Absensi Store</title>
    
    <!-- PWA & Mobile Native Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Absensi Store">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/712/712013.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen p-2 sm:p-4 select-none">

    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl overflow-hidden flex flex-col h-[92vh] max-h-[880px]">
        
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 sm:p-5 flex justify-between items-center shrink-0 shadow-md">
            <div>
                <h1 class="text-base sm:text-lg font-bold tracking-tight">Portal Absensi Store</h1>
                <p class="text-[11px] text-indigo-200" id="current-date">Memuat tanggal...</p>
            </div>
            <div class="bg-indigo-500/80 backdrop-blur px-3 py-1 rounded-full text-[11px] font-semibold border border-indigo-300">
                Sales Active
            </div>
        </div>

        <!-- Konten Utama -->
        <div class="p-4 sm:p-5 flex-1 overflow-y-auto space-y-3.5">
            
            <!-- Live Clock Widget -->
            <div class="bg-gradient-to-br from-indigo-50 to-blue-50 border border-indigo-100 rounded-xl p-3 text-center shadow-sm">
                <p class="text-[10px] text-indigo-500 font-bold uppercase tracking-wider">Waktu Real-time</p>
                <h2 class="text-3xl font-extrabold text-indigo-900 mt-0.5 tracking-tight" id="live-clock">00:00:00</h2>
            </div>

            <!-- Dropdown 1: Store -->
            <div class="space-y-1">
                <label for="select-store" class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Cabang / Store</label>
                <select id="select-store" onchange="onStoreChange()" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-medium text-slate-800 transition">
                    <option value="">-- Memuat Daftar Store... --</option>
                </select>
            </div>

            <!-- Dropdown 2: Karyawan -->
            <div class="space-y-1">
                <label for="select-employee" class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Nama Sales / Karyawan</label>
                <select id="select-employee" disabled onchange="checkUserAttendanceState()" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-100 text-slate-500 disabled:cursor-not-allowed transition">
                    <option value="">-- Pilih Store Terlebih Dahulu --</option>
                </select>
            </div>

            <!-- Dropdown 3: Jam Shift Kerja (DISEMBUNYIKAN SEMENTARA) -->
            <div id="container-shift" class="space-y-1 hidden">
                <label for="select-shift" class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Jam Shift Kerja</label>
                <select id="select-shift" disabled class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-100 text-slate-500 disabled:cursor-not-allowed transition">
                    <option value="">-- Pilih Store Terlebih Dahulu --</option>
                </select>
            </div>

            <!-- Status & GPS Panel -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 shadow-sm space-y-1.5">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-500 font-medium">Status Absen Hari Ini:</span>
                    <span id="attendance-status" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">Belum Absen</span>
                </div>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-500 font-medium">Lokasi GPS:</span>
                    <span id="gps-status" class="text-slate-700 font-semibold truncate max-w-[190px]">Mendeteksi lokasi...</span>
                </div>
            </div>

            <!-- Mandatory Foto Selfie -->
            <div class="space-y-1">
                <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wider flex justify-between">
                    <span>Verifikasi Foto Selfie</span>
                    <span class="text-rose-500 text-[10px] font-extrabold">*WAJIB FOTO</span>
                </label>
                <div class="border-2 border-dashed border-slate-300 rounded-xl p-2.5 text-center bg-slate-50 relative hover:bg-slate-100 transition">
                    <input type="file" accept="image/*" capture="user" id="camera-input" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="previewAndCompressImage(event)">
                    <div id="camera-placeholder" class="space-y-1">
                        <svg class="w-6 h-6 mx-auto text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <p class="text-xs text-slate-500 font-medium">Tap untuk Ambil Foto Selfie</p>
                    </div>
                    <img id="image-preview" class="hidden w-full h-28 object-cover rounded-lg mx-auto" alt="Preview Foto Selfie">
                </div>
            </div>

            <!-- Tombol Clock In / Out -->
            <div class="grid grid-cols-2 gap-3 pt-0.5">
                <button id="btn-clock-in" onclick="submitAttendance('Clock In')" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3 px-3 rounded-xl shadow-md transition text-xs sm:text-sm flex items-center justify-center gap-1.5 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
                    <span>Clock In</span>
                </button>
                <button id="btn-clock-out" onclick="submitAttendance('Clock Out')" class="bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-bold py-3 px-3 rounded-xl shadow-md transition text-xs sm:text-sm flex items-center justify-center gap-1.5 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
                    <span>Clock Out</span>
                </button>
            </div>

        </div>

        <!-- Footer -->
        <div class="bg-slate-50 border-t border-slate-200 p-2 text-center text-[10px] text-slate-400 shrink-0 font-medium">
            Absensi Retail App • Multi-Store v2.5 PWA
        </div>

    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbysnYJNbtypJLXnG9OzVJF7Q9X1uMl9kjqzR_ukg-Jnq4GKGNHnbOAQbqrPd3FEvfu0/exec';

        let masterStores = [];
        let masterKaryawan = [];
        let masterShifts = [];
        let compressedBase64Photo = "";

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('id-ID');
            document.getElementById('current-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

        window.onload = async function() {
            initGPS();
            await fetchMasterData();
        };

        function initGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const lat = pos.coords.latitude.toFixed(5);
                        const lon = pos.coords.longitude.toFixed(5);
                        
                        const gpsElem = document.getElementById('gps-status');
                        gpsElem.innerText = "Menerjemahkan alamat...";
                        gpsElem.className = "text-amber-600 font-semibold text-xs animate-pulse";

                        try {
                            const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`);
                            const data = await res.json();

                            const area = [data.locality || data.city, data.principalSubdivision].filter(Boolean).join(', ');
                            const addressText = area ? `${area} (${lat}, ${lon})` : `${lat}, ${lon}`;

                            gpsElem.innerText = addressText;
                            gpsElem.className = "text-emerald-600 font-semibold text-xs truncate max-w-[190px]";
                            gpsElem.title = addressText;
                        } catch (err) {
                            gpsElem.innerText = `${lat}, ${lon}`;
                            gpsElem.className = "text-emerald-600 font-semibold text-xs";
                        }
                    },
                    (err) => {
                        document.getElementById('gps-status').innerText = "GPS Ditolak / Off";
                        document.getElementById('gps-status').className = "text-rose-600 font-semibold text-xs";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                document.getElementById('gps-status').innerText = "GPS Tidak Didukung";
                document.getElementById('gps-status').className = "text-rose-600 font-semibold text-xs";
            }
        }

        async function fetchMasterData() {
            const selectStore = document.getElementById('select-store');
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                
                if (data.status === "success") {
                    masterStores = data.stores || [];
                    masterKaryawan = data.karyawan || [];
                    masterShifts = data.shifts || [];
                    populateStoreDropdown();
                } else {
                    selectStore.innerHTML = '<option value="">-- Gagal Memuat Data --</option>';
                }
            } catch (err) {
                selectStore.innerHTML = '<option value="">-- Error Koneksi Server --</option>';
            }
        }

        function populateStoreDropdown() {
            const selectStore = document.getElementById('select-store');
            selectStore.innerHTML = '<option value="">-- Pilih Store --</option>';
            masterStores.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.nama;
                selectStore.appendChild(opt);
            });
        }

        function onStoreChange() {
            const storeSelect = document.getElementById('select-store');
            const storeId = storeSelect.value;
            const storeNama = storeSelect.options[storeSelect.selectedIndex]?.text || '';
            
            const selectEmp = document.getElementById('select-employee');
            const selectShift = document.getElementById('select-shift');
            
            selectEmp.innerHTML = '';
            selectShift.innerHTML = '';
            
            if (!storeId) {
                selectEmp.disabled = true;
                selectShift.disabled = true;
                selectEmp.className = "w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-slate-100 text-slate-500 disabled:cursor-not-allowed transition";
                selectShift.className = "w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-slate-100 text-slate-500 disabled:cursor-not-allowed transition";
                selectEmp.innerHTML = '<option value="">-- Pilih Store Terlebih Dahulu --</option>';
                selectShift.innerHTML = '<option value="">-- Pilih Store Terlebih Dahulu --</option>';
                return;
            }

            // Filter Karyawan
            const filteredEmp = masterKaryawan.filter(k => k.storeId === storeId);
            selectEmp.disabled = false;
            selectEmp.className = "w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-slate-50 text-slate-800 font-medium focus:ring-2 focus:ring-indigo-500 transition";
            selectEmp.innerHTML = '<option value="">-- Pilih Nama Sales --</option>';

            filteredEmp.forEach(k => {
                const opt = document.createElement('option');
                opt.value = k.nama;
                opt.textContent = `${k.nama} (${k.jabatan})`;
                selectEmp.appendChild(opt);
            });

            // Filter Shift (Background processing)
            const isBatavia = storeNama.toLowerCase().includes("batavia");
            const targetType = isBatavia ? "batavia" : "mall";
            const filteredShifts = masterShifts.filter(s => s.tipe.toLowerCase() === targetType);
            
            selectShift.disabled = false;
            selectShift.innerHTML = '<option value="">-- Pilih Jam Shift --</option>';
            filteredShifts.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.nama;
                opt.textContent = s.nama;
                selectShift.appendChild(opt);
            });

            resetAttendanceStateUI();
        }

        function checkUserAttendanceState() {
            const karyawanNama = document.getElementById('select-employee').value;
            if (!karyawanNama) {
                resetAttendanceStateUI();
                return;
            }

            const todayKey = new Date().toISOString().split('T')[0];
            const stateKey = `attendance_${karyawanNama}_${todayKey}`;
            const lastState = localStorage.getItem(stateKey);

            const statusBadge = document.getElementById('attendance-status');
            const btnIn = document.getElementById('btn-clock-in');
            const btnOut = document.getElementById('btn-clock-out');

            if (lastState === 'Clock In') {
                statusBadge.innerText = 'Sudah Clock In';
                statusBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800';
                btnIn.disabled = true;
                btnOut.disabled = false;
            } else if (lastState === 'Clock Out') {
                statusBadge.innerText = 'Sudah Clock Out (Selesai)';
                statusBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-blue-100 text-blue-800';
                btnIn.disabled = true;
                btnOut.disabled = true;
            } else {
                resetAttendanceStateUI();
            }
        }

        function resetAttendanceStateUI() {
            document.getElementById('attendance-status').innerText = 'Belum Absen';
            document.getElementById('attendance-status').className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800';
            document.getElementById('btn-clock-in').disabled = false;
            document.getElementById('btn-clock-out').disabled = false;
        }

        function previewAndCompressImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const scale = MAX_WIDTH / img.width;

                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scale;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    compressedBase64Photo = canvas.toDataURL('image/jpeg', 0.6);

                    const output = document.getElementById('image-preview');
                    output.src = compressedBase64Photo;
                    output.classList.remove('hidden');
                    document.getElementById('camera-placeholder').classList.add('hidden');
                };
            };
        }

        async function submitAttendance(type) {
            const storeSelect = document.getElementById('select-store');
            const storeNama = storeSelect.options[storeSelect.selectedIndex]?.text || '';
            const karyawanNama = document.getElementById('select-employee').value;
            const shiftSelect = document.getElementById('select-shift');
            const shiftNama = (shiftSelect && shiftSelect.value) ? shiftSelect.value : '-';
            const gps = document.getElementById('gps-status').innerText;

            if (!storeSelect.value) {
                alert("Harap pilih Store lokasi kerja Anda!");
                return;
            }
            if (!karyawanNama) {
                alert("Harap pilih Nama Sales Anda!");
                return;
            }
            if (!compressedBase64Photo) {
                alert("FOTO WAJIB DIAMBIL! Harap ambil foto selfie terlebih dahulu sebelum absen.");
                return;
            }
            if (gps.includes("Ditolak") || gps.includes("Mendeteksi") || gps.includes("Tidak Didukung")) {
                alert("Harap tunggu lokasi GPS terdeteksi atau aktifkan akses lokasi di browser!");
                return;
            }

            const payload = {
                storeNama: storeNama,
                karyawanNama: karyawanNama,
                shiftNama: shiftNama,
                status: type,
                gps: gps,
                fotoBase64: compressedBase64Photo
            };

            const btnIn = document.getElementById('btn-clock-in');
            const btnOut = document.getElementById('btn-clock-out');
            btnIn.disabled = true;
            btnOut.disabled = true;

            try {
                alert(`Mengirim data ${type}... Mohon tunggu.`);
                
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const todayKey = new Date().toISOString().split('T')[0];
                localStorage.setItem(`attendance_${karyawanNama}_${todayKey}`, type);

                alert(`Berhasil ${type}!\nSales: ${karyawanNama}\nStore: ${storeNama}`);
                checkUserAttendanceState();

            } catch (err) {
                alert("Gagal mengirim absensi ke server.");
                btnIn.disabled = false;
                btnOut.disabled = false;
            }
        }
    </script>
</body>
</html>
